version: '1.0'
name: Next Lottery Simple Pipeline
description: 简化的 Next.js 项目构建部署流水线
displayName: pipeline-20250929
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''

variables:
  PLUGIN_NPM_VERSION: 20.18.0
  GITEE_PIPELINE_NAME: pipeline-20250929

stages:
  - build
  - deploy

build:
  stage: build
  image: node:$PLUGIN_NPM_VERSION
  script:
    - npm install
    - npm run build
  artifacts:
    - name: BUILD_ARTIFACT
      paths:
       - .next/
       - public/
  cache:
    paths:
      - node_modules/
    key: "$GITEE_PIPELINE_NAME"

deploy:
  stage: deploy
  image: node:$PLUGIN_NPM_VERSION
  script:
    - echo "自动部署到 Gitee Pages"
    - echo "确保已在仓库设置中启用 Pages 服务"
    - npm run start
  dependencies:
    - build
  only:
    - master