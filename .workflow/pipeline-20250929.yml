version: '1.0'
name: Next Lottery Simple Pipeline
description: 简化的 Next.js 项目构建部署流水线
displayName: pipeline-20250929
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - build
  - deploy

build:
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
  cache:
    paths:
      - node_modules/
    key: "$GITEE_PIPELINE_NAME"

deploy:
  stage: deploy
  script:
    - echo "自动部署到 Gitee Pages"
    - echo "确保已在仓库设置中启用 Pages 服务"
    - run run start
  dependencies:
    - build
  only:
    - master