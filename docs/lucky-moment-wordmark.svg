  <path d="M169 139c79 8 263 10 342-1" fill="none" stroke="#fff0a3" stroke-linecap="round" stroke-width="2" opacity=".8" />
  <g fill="url(#shine)">
    <path d="m91 50 5 13 13 5-13 5-5 13-5-13-13-5 13-5 5-13Z" />
    <path d="m589 43 3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5 3.5-9Z" />
    <path d="m557 126 3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3 3-7.5Z" opacity=".85" />
  </g>
  <circle cx="114" cy="112" r="4" fill="#f3b52a" />
  <circle cx="612" cy="103" r="4" fill="#f3b52a" />
</svg>
